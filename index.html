<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Daily Hub Pro v3.1</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<!-- =====================
HOME
===================== -->

<section
id="homePage"
class="page active">

<h1 id="appTitle">
Daily Hub Pro
</h1>

<div id="statsArea">

<div class="stat-card">
メモ
<span id="memoCount">
0
</span>
</div>

<div class="stat-card">
タスク
<span id="taskCount">
0
</span>
</div>

<div class="stat-card">
添付
<span id="attachmentCount">
0
</span>
</div>

<div class="stat-card">
容量
<span id="storageSize">
0MB
</span>
</div>

</div>

<div class="menu-grid">

<button
onclick="showCalendarPage()">
📅
カレンダー
</button>

<button
onclick="showMemoList()">
📝
メモ一覧
</button>

<button
onclick="showTaskList()">
✅
タスク一覧
</button>

<button
onclick="showAttachmentList()">
📎
添付一覧
</button>

<button
onclick="showSearchPage()">
🔍
検索
</button>

<button
onclick="showSettingsPage()">
⚙️
設定
</button>

</div>

</section>

<!-- =====================
CALENDAR
===================== -->

<section
id="calendarPage"
class="page">

<div class="topbar">

<button
onclick="goHome()">
← ホーム
</button>

<h2 id="calendarTitle">
2026年6月
</h2>

</div>

<div class="calendar-nav">

<button
onclick="prevMonth()">
◀
</button>

<button
onclick="goToday()">
今日
</button>

<button
onclick="nextMonth()">
▶
</button>

</div>

<div
id="calendar"
class="calendar">
</div>

<div
id="selectedDateBox"
class="card">

<h3 id="selectedDate">
日付未選択
</h3>

</div>

<div class="card">

<h3>
📝 メモ
</h3>

<select id="memoTag">
</select>

<textarea
id="memoInput"
rows="5"
placeholder="メモを入力">
</textarea>

</div>

<div class="card">

<h3>
✅ タスク
</h3>

<div class="task-input">

<input
type="text"
id="taskInput"
placeholder="タスク入力">

<button
onclick="addTask()">
追加
</button>

</div>

<div
id="taskArea">
</div>

</div>

<div class="card">

<h3>
📎 添付
</h3>

<input
type="file"
id="attachmentInput"
multiple>

<button
onclick="saveAttachment()">
添付保存
</button>

<div
id="attachmentArea">
</div>

</div>

</section>
<!-- =====================
MEMO PAGE
===================== -->

<section
id="memoPage"
class="page">

<div class="topbar">

<button
onclick="goHome()">
← ホーム
</button>

<h2>
メモ一覧
</h2>

</div>

<div
id="memoListArea">
</div>

</section>

<!-- =====================
TASK PAGE
===================== -->

<section
id="taskPage"
class="page">

<div class="topbar">

<button
onclick="goHome()">
← ホーム
</button>

<h2>
タスク一覧
</h2>

</div>

<div
id="taskListArea">
</div>

</section>

<!-- =====================
ATTACHMENT PAGE
===================== -->

<section
id="attachmentPage"
class="page">

<div class="topbar">

<button
onclick="goHome()">
← ホーム
</button>

<h2>
添付一覧
</h2>

</div>

<div
id="attachmentListArea">
</div>

</section>

<!-- =====================
SEARCH PAGE
===================== -->

<section
id="searchPage"
class="page">

<div class="topbar">

<button
onclick="goHome()">
← ホーム
</button>

<h2>
検索
</h2>

</div>

<input
id="searchInput"
placeholder="検索">

<button
onclick="runSearch()">
検索
</button>

<div
id="searchResult">
</div>

</section>

<!-- =====================
STATS PAGE
===================== -->

<section
id="statsPage"
class="page">

<div class="topbar">

<button
onclick="goHome()">
← ホーム
</button>

<h2>
統計
</h2>

</div>

<div
id="statsDetail">
</div>

</section>

<!-- =====================
BACKUP PAGE
===================== -->

<section
id="backupPage"
class="page">

<div class="topbar">

<button
onclick="goHome()">
← ホーム
</button>

<h2>
バックアップ
</h2>

</div>

<button
onclick="exportData()">
JSON出力
</button>

<input
type="file"
id="importFile">

<button
onclick="importData()">
JSON読込
</button>

</section>
<!-- =====================
SETTINGS PAGE
===================== -->

<section
id="settingsPage"
class="page">

<div class="topbar">

<button
onclick="goHome()">
← ホーム
</button>

<h2>
⚙️ 設定
</h2>

</div>

<div class="card">

<h3>
🏷️ タグ管理
</h3>

<button>
タグ追加
</button>

<button>
タグ編集
</button>

<button>
タグ削除
</button>

</div>

<div class="card">

<h3>
📝 タスク化メモ
</h3>

<button>
設定
</button>

</div>

<div class="card">

<h3>
🔒 パスコード
</h3>

<button>
設定
</button>

</div>

<div class="card">

<h3>
🎨 テーマ
</h3>

<button>
ライトモード
</button>

<button>
ダークモード
</button>

</div>

<div class="card">

<h3>
📊 統計
</h3>

<button
onclick="showStatsPage()">
統計を開く
</button>

</div>

<div class="card">

<h3>
💾 バックアップ
</h3>

<button
onclick="showBackupPage()">
バックアップを開く
</button>

</div>

<div class="card">

<h3>
ℹ️ アプリ情報
</h3>

<p>
Daily Hub Pro v3.1
</p>

</div>

<div class="card">

<h3>
🗑️ データ管理
</h3>

<button
onclick="clearAllData()">
全データ削除
</button>

</div>

</section>

<script src="db.js"></script>
<script src="calendar.js"></script>
<script src="memo.js"></script>
<script src="task.js"></script>
<script src="attachment.js"></script>
<script src="search.js"></script>
<script src="stats.js"></script>
<script src="backup.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>

</body>
</html>
